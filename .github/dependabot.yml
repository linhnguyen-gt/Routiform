version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 10
    groups:
      production:
        dependency-type: "production"
      development:
        dependency-type: "development"
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      # typescript-eslint peers on `typescript >=4.8.4 <6.1.0`, and no release supports
      # TypeScript 7 yet. A major bump makes `npm ci` fail ERESOLVE, which takes down every
      # job in the workflow and blocks the other ~19 dev-dependency updates grouped with it.
      # Drop this entry once typescript-eslint widens the peer range.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # We hand our own `undici` Agent to the runtime's global `fetch`, which is backed by
      # the undici that Node bundles (6.28.0 on Node 22). undici 8 rewrote the Dispatcher
      # handler interface, so a v8 Agent rejects the legacy handler Node's fetch builds and
      # every outbound request dies with `UND_ERR_INVALID_ARG: invalid onRequestStart method`.
      # Only lift this once the bundled undici is >= the major we depend on.
      - dependency-name: "undici"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
